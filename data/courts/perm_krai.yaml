  territory_text: 'Кудымкарский р-н: в пределах части границ Кудымкарского городского округа: от юго-восточной стороны плодово-ягодного питомника Кудымкарского р-на вниз по течению реки Иньва до ул. Набережной
    города Кудымкара далее на север по улице Набережной города Кудымкара с пересечением улиц Красноармейской, Хорошева, Чкалова, Карла Маркса, Революционной города Кудымкара до ул. Максима Горького города
