    городской площади до пересечения улиц Лихачева и 50 лет Октября города Кудымкара далее на восток от пересечения улиц Лихачева и 50 лет Октября города Кудымкара по середине ул. 50 лет Октября города
    Кудымкара с пересечением улиц Гагарина, Герцена, Пушкина, Свободы, Гоголя города Кудымкара до пересечения с улицей Дзержинского города Кудымкара далее на восток от пересечения улиц 50 лет Октября и
