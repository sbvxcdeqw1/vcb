# Настройки расчёта по умолчанию. Любой параметр можно переопределить ключом CLI или своим файлом (--config).
penalty:
  mode: calendar        # calendar - как в образцах заказчика; statutory - строго по дням ст. 155 ЖК РФ
  divisor1: 300         # 31-90 день просрочки
  divisor2: 130         # с 91 дня
  tier1_days: 60
  due_day: 10           # срок оплаты - до 10 числа месяца, следующего за расчётным
  include_payment_day: false
  key_rate: 9.5         # % годовых, если даты нет в таблице ставок
  key_rates_file: data/key_rates.csv   # история ключевой ставки ЦБ (cbr.ru): дата_с;ставка; обновляйте по мере изменений
  # Потолок ставки для пени за ЖКУ. В образцах заказчика на 13.04.2026 применена ставка 9,5%, хотя ключевая
  # ставка ЦБ в этот день была выше (data/key_rates.csv) - расчёт сходится только с потолком.
  # ПРОВЕРИТЬ границы периода по действующим актам (ч. 14 ст. 155 ЖК РФ, постановления Правительства РФ).
  rate_cap: {value: 9.5, from: 2023-01-01, to: 2026-12-31}
  # Периоды, в которые пени не начисляются. ПРОВЕРИТЬ по действующим постановлениям Правительства РФ
  # (по умолчанию: ПП № 424 от 02.04.2020 и ПП № 474 от 26.03.2022).
  # Взносы на капитальный ремонт - ч. 14.1 ст. 155 ЖК РФ: пени 1/300 ставки с 31-го дня просрочки, без перехода на 1/130.
  # Срок оплаты - как по ЖКУ (до 10 числа). ПРОВЕРИТЬ по актуальной редакции кодекса.
  caprepair:
    due_day: 10
    divisor2: 300
  moratoria:
    - [2020-04-06, 2020-12-31]
    - [2022-03-29, 2022-12-31]

claim:
  # Расчётный период задаёт оператор (--period-from/--period-to или колонки period_from/period_to в реестре
  # должников); без указания - от первого до последнего начисления выгрузки. Срок давности автоматически не
  # применяется: периоды «за давностью» входят в расчёт. Если нужен автоотбор - число лет (например, 3).
  limitation_years: null

court:
  doc: auto             # auto | order (судебный приказ) | claim (иск)
  order_limit: 500000   # ст. 121 ГПК РФ, руб.
  magistrate_claim_limit: 100000  # ст. 23 ГПК РФ, руб.; выше - районный суд
  claim_court: auto     # auto | magistrate | district (в образцах заказчика иски поданы в районный суд)

# Госпошлина ст. 333.19 НК РФ. ПРОВЕРИТЬ на дату подачи: ступени и минимумы менялись.
fee:
  tiers:                # (цена до, фикс, ставка, от какой суммы)
    - [100000, 0, 0.04, 0]
    - [300000, 4000, 0.03, 100000]
    - [500000, 10000, 0.025, 300000]
    - [1000000, 15000, 0.02, 500000]
    - [null, 25000, 0.01, 1000000]
  min_district: 4000    # в образцах: 4000,00 при цене иска 29-75 тыс. руб.
  min_magistrate: 400
  max: 900000
  order_share: 0.5      # по судебному приказу - 50% (пп. 13 п. 1 ст. 333.19 / ст. 333.20 НК РФ)

# Оплаты из реестра банковских документов (--payments).
# Сальдо на начало периода в расчёт не входит никогда.
payments:
  allocation: purpose          # purpose - оплата идёт на период из назначения, остаток и оплаты без периода - на
                               # самые ранние долги; oldest - всё на самые ранние долги
  enforcement_patterns:        # платёж по исполнительному производству - в зачёт не берётся
    - 'судебн\w*\s+приказ'
    - 'исполнительн'
    - '\d+/\d+/\d+-ИП'
    - '\bИП\b'
    - 'ФССП'
    - 'судебн\w*\s+пристав'
    - 'погашени\w+\s+долга'
  third_party_patterns:        # платёж бюджетной организации (КБК / лицевой счёт казначейства) - неоднозначно
    - 'л/с\s*0\d{10}'
    - '\d{3}-\d{4}-\d{10}-\d{3}'
  third_party_policy: include  # include - зачитывать (принято), exclude - не зачитывать, ask - зачитывать с пометкой
