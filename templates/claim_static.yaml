housing_law:
- В соответствии с Жилищным кодексом Российской Федерации собственник жилого помещения несет бремя содержания данного помещения и, если данное помещение является квартирой, общего имущества собственников помещений в соответствующем многоквартирном доме.
- Согласно статье 153 Жилищного кодекса Российской Федерации граждане обязаны своевременно и полностью вносить плату за жилое помещение и коммунальные услуги.
- 'В соответствии со статьей 154 Жилищного кодекса Российской Федерации плата за жилое помещение и коммунальные услуги для собственника помещения в многоквартирном доме включает в себя:'
- 1) плату за содержание и ремонт жилого помещения, в том числе плату за услуги и работы по управлению многоквартирным домом, содержанию, текущему ремонту общего имущества в многоквартирном доме;
- 2) взнос на капитальный ремонт;
- 3) плату за коммунальные услуги.
- Плата за коммунальные услуги включает в себя плату за горячее водоснабжение,
- холодное водоснабжение, водоотведение, электроснабжение, газоснабжение (в том числе поставки бытового газа в баллонах), отопление (теплоснабжение, в том числе поставки твердого топлива при наличии печного отопления).
- Согласно статье 155 Жилищного кодекса Российской Федерации плата за жилое помещение и коммунальные услуги вносится ежемесячно до десятого числа месяца, следующего за истекшим месяцем, если иной срок не установлен договором управления многоквартирным домом либо решением общего собрания членов товарищества собственников жилья.
- Плата за жилое помещение и коммунальные услуги вносится на основании платежных документов (в том числе платежных документов в электронной форме, размещенных в системе), представленных не позднее первого числа месяца, следующего за истекшим месяцем, если иной срок не установлен договором управления многоквартирным домом либо решением общего собрания членов товарищества собственников жилья, жилищного кооператива или иного специализированного потребительского кооператива.
- В соответствии со статьей 156 Жилищного кодекса Российской Федерации плата за содержание жилого помещения устанавливается в размере, обеспечивающем содержание общего имущества в многоквартирном доме в соответствии с требованиями законодательства.
- Согласно статье 157 Жилищного кодекса Российской Федерации размер платы за коммунальные услуги рассчитывается исходя из объема потребляемых коммунальных услуг, определяемого по показаниям приборов учета, а при их отсутствии исходя из нормативов потребления коммунальных услуг (в том числе нормативов накопления твердых коммунальных отходов), утверждаемых органами государственной власти субъектов Российской Федерации в порядке, установленном Правительством Российской Федерации.
- «Правила предоставления коммунальных услуг собственникам и пользователям помещений в многоквартирных домах и жилых домах» утверждены постановлением Правительства Российской Федерации от 06.05.2011г. №354.
penalty_law:
- 'В соответствии с частью 14 статьи 155 Жилищного кодекса РФ лица, несвоевременно и (или) не полностью внесшие плату за жилое помещение и коммунальные услуги, обязаны уплатить кредитору пени:'
- '- с 1 января 2016 года - в размере одной трехсотой ставки рефинансирования Центрального банка Российской Федерации, действующей на день фактической оплаты, от не выплаченной в срок суммы за каждый день просрочки начиная с тридцать первого дня, следующего за днем наступления установленного срока оплаты, по день фактической оплаты, произведенной в течение девяноста календарных дней со дня наступления установленного срока оплаты, либо до истечения девяноста календарных дней после дня наступления установленного срока оплаты, если в девяностодневный срок оплата не произведена. Начиная с девяносто первого дня, следующего за днем наступления установленного срока оплаты, по день фактической оплаты пени уплачиваются в размере одной стотридцатой ставки рефинансирования Центрального банка Российской Федерации, действующей на день фактической оплаты, от не выплаченной в срок суммы за каждый день просрочки.'
- В соответствии с частью 14.1 статьи 155 Жилищного кодекса РФ собственники помещений в многоквартирном доме, несвоевременно и (или) не полностью уплатившие взносы на капитальный ремонт, обязаны уплатить в фонд капитального ремонта пени в размере одной трехсотой ставки рефинансирования Центрального банка Российской Федерации, действующей на день фактической оплаты, от не выплаченной в срок суммы за каждый день просрочки начиная с тридцать первого дня, следующего за днем наступления установленного срока оплаты, по день фактической оплаты.
- С 01.01.2016 года значение ставки рефинансирования ЦБ РФ приравнено к значению ключевой ставки Банка России на соответствующую дату.
costs_law:
- Согласно статье 88 Гражданского процессуального кодекса Российской Федерации судебные расходы состоят из государственной пошлины и издержек, связанных с рассмотрением дела.
- В соответствии со статьей 98 Гражданского процессуального кодекса Российской Федерации стороне, в пользу которой состоялось решение суда, суд присуждает возместить с другой стороны все понесенные по делу судебные расходы.
