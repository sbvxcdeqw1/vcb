[project]
name = "vcb"
version = "0.5.1"
description = "Карточки расчёта, шахматка и заявления в суд по задолженности за ЖКУ и капремонт из выгрузок 1С"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "pyyaml>=6", "xlrd>=2.0", "num2words>=0.5"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = ["pytest"]

[project.scripts]
vcb = "vcb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcb = ["../../data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
